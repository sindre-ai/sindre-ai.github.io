<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- Maskin backend base URL — the Chronicle page hydrates from {base}/v1/changelog. Override per environment. -->
  <meta name="maskin-api-base" content="https://maskin.sindre.ai" />

  <!-- Email subscribe target. mailto: works without account setup; swap to a hosted form URL (e.g. HubSpot share link) when ready. -->
  <meta name="maskin-changelog-subscribe-url" content="mailto:changelog@sindre.ai?subject=Subscribe%20to%20the%20Maskin%20changelog" />

  <title>Changelog · Maskin</title>
  <meta name="description" content="Every change to Maskin, posted weekly. Subscribe by email or RSS." />

  <link rel="canonical" href="https://sindre.ai/changelog" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

  <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
  <meta name="color-scheme" content="dark light" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />

  <!-- Per-page RSS discovery — the feed itself is served by Maskin (T5). -->
  <link rel="alternate" type="application/rss+xml" title="Maskin changelog" href="https://maskin.sindre.ai/v1/changelog.xml" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Maskin" />
  <meta property="og:url" content="https://sindre.ai/changelog" />
  <meta property="og:title" content="Changelog · Maskin" />
  <meta property="og:description" content="Every change to Maskin, posted weekly. Subscribe by email or RSS." />
  <meta property="og:image" content="https://sindre.ai/og-image.svg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Maskin changelog" />
  <meta property="og:locale" content="en_US" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@Sindre_ai" />
  <meta name="twitter:creator" content="@Sindre_ai" />
  <meta name="twitter:title" content="Changelog · Maskin" />
  <meta name="twitter:description" content="Every change to Maskin, posted weekly. Subscribe by email or RSS." />
  <meta name="twitter:image" content="https://sindre.ai/og-image.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ===== Tokens — mirrored from /index.html (dark-first marketing site) ===== */
    :root {
      --bg: #09090b;
      --bg-surface: #131316;
      --bg-elevated: #1c1c20;
      --bg-hover: #222228;
      --bg-glass: rgba(9,9,11,0.82);
      --text: #f4f4f5;
      --text-secondary: #8a8f98;
      --text-muted: #71717a;
      --border: rgba(255,255,255,0.06);
      --border-hover: rgba(255,255,255,0.1);
      --border-strong: rgba(255,255,255,0.14);
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --accent-subtle: color-mix(in srgb, var(--accent) 10%, transparent);
      --accent-text: color-mix(in srgb, var(--accent) 60%, #fff);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 2px 4px rgba(0,0,0,0.2), 0 8px 24px -4px rgba(0,0,0,0.4);
      --green: #34d399;
      --green-bg: rgba(16,185,129,0.12);
      --green-text: #6ee7b7;
      --blue-bg: rgba(59,130,246,0.12);
      --blue-text: #93c5fd;
      --amber-bg: rgba(245,158,11,0.12);
      --amber-text: #fcd34d;
      --rose-bg: rgba(244,63,94,0.12);
      --rose-text: #fda4af;
    }

    [data-theme="light"] {
      --bg: #fafafa;
      --bg-surface: #f4f4f5;
      --bg-elevated: #ffffff;
      --bg-hover: #e4e4e7;
      --bg-glass: rgba(250,250,250,0.82);
      --text: #18181b;
      --text-secondary: #52525b;
      --text-muted: #71717a;
      --border: rgba(0,0,0,0.06);
      --border-hover: rgba(0,0,0,0.1);
      --border-strong: rgba(0,0,0,0.14);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-subtle: rgba(99,102,241,0.08);
      --accent-text: #4338ca;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 2px 4px rgba(0,0,0,0.03), 0 8px 24px -4px rgba(0,0,0,0.06);
      --green: #10b981;
      --green-bg: #ecfdf5;
      --green-text: #065f46;
      --blue-bg: #eff6ff;
      --blue-text: #1e40af;
      --amber-bg: #fffbeb;
      --amber-text: #92400e;
      --rose-bg: #fff1f2;
      --rose-text: #9f1239;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: "Geist Sans", "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background 0.4s ease, color 0.4s ease;
    }

    a { color: inherit; }

    /* ===== NAV — matches the marketing-site shell, scoped to the changelog page ===== */
    .nav {
      position: sticky; top: 0; z-index: 100;
      background: var(--bg-glass);
      backdrop-filter: blur(16px) saturate(1.4);
      -webkit-backdrop-filter: blur(16px) saturate(1.4);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: 1100px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; height: 64px; gap: 16px;
    }
    .nav-logo {
      font-size: 16px; font-weight: 600; color: var(--text);
      text-decoration: none; letter-spacing: -0.01em;
      display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px;
    }
    .nav-links { display: flex; align-items: center; gap: 4px; list-style: none; }
    .nav-links a {
      font-size: 13.5px; color: var(--text-secondary); text-decoration: none;
      padding: 8px 12px; border-radius: 6px;
      transition: color 0.15s, background 0.15s;
      min-height: 44px; display: inline-flex; align-items: center;
    }
    .nav-links a:hover { color: var(--text); background: var(--bg-hover); }
    .nav-links a.active { color: var(--text); }
    .nav-cta {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 8px 16px; border-radius: 8px; font-size: 13.5px; font-weight: 500;
      background: var(--bg-elevated); color: var(--text); text-decoration: none;
      border: 1px solid var(--border-hover);
      transition: all 0.2s;
      min-height: 44px;
    }
    .nav-cta:hover { border-color: var(--border-strong); background: var(--bg-hover); }

    /* ===== HEADER ===== */
    .page-header {
      max-width: 1100px; margin: 0 auto;
      padding: 64px 24px 40px;
    }
    .page-title {
      font-size: 40px; font-weight: 600; letter-spacing: -0.03em;
      line-height: 1.1; color: var(--text);
      margin-bottom: 12px;
    }
    .page-sub {
      color: var(--text-secondary); font-size: 16px; line-height: 1.5;
      max-width: 520px; margin-bottom: 28px;
    }
    .header-actions {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .subscribe-form {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    }
    .subscribe-input {
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 14px;
      width: 240px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      min-height: 44px;
    }
    .subscribe-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-subtle);
    }
    .subscribe-input::placeholder { color: var(--text-muted); }
    .subscribe-btn {
      background: var(--text); color: var(--bg);
      border: none; border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px; font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: transform 0.15s, opacity 0.15s;
      min-height: 44px;
    }
    .subscribe-btn:hover:not(:disabled) { transform: translateY(-1px); }
    .subscribe-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .subscribe-msg {
      font-size: 13px;
      color: var(--text-secondary);
      min-height: 18px;
    }
    .subscribe-msg.is-error { color: var(--rose-text); }
    .subscribe-msg.is-success { color: var(--green-text); }
    .rss-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--text-muted); font-size: 13px;
      text-decoration: none;
      padding: 10px 12px; border-radius: 8px;
      transition: color 0.15s, background 0.15s;
      min-height: 44px;
    }
    .rss-link:hover { color: var(--text); background: var(--bg-hover); }

    /* ===== LAYOUT ===== */
    .changelog-layout {
      max-width: 1100px; margin: 0 auto;
      padding: 0 24px 80px;
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 0 48px;
    }
    .date-index {
      position: sticky; top: 80px;
      height: fit-content;
      align-self: start;
    }
    .date-group-label {
      font-size: 11px; font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.08em; text-transform: uppercase;
      padding: 4px 0;
      margin: 28px 0 6px;
    }
    .date-group-label:first-child { margin-top: 0; }
    .date-index-item {
      display: block;
      font-size: 13.5px;
      color: var(--text-secondary);
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 6px;
      margin-left: -10px;
      transition: color 0.15s, background 0.15s, font-weight 0.15s;
      min-height: 44px;
      line-height: 32px;
    }
    .date-index-item:hover {
      color: var(--text);
      background: var(--bg-hover);
    }
    .date-index-item.active {
      color: var(--text);
      font-weight: 600;
    }

    .entries {
      border-left: 1px solid var(--border);
      padding-left: 48px;
      min-width: 0;
    }
    .month-group { margin-bottom: 56px; }
    .month-group:last-child { margin-bottom: 0; }
    .month-anchor {
      font-size: 11px; font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.08em; text-transform: uppercase;
      padding-bottom: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      scroll-margin-top: 80px;
    }

    .entry {
      padding: 0 0 40px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 40px;
    }
    .entry:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .entry-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .entry-date { font-size: 12.5px; color: var(--text-muted); }
    .entry-title {
      font-size: 17px; font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.3;
      margin-bottom: 8px;
      color: var(--text);
    }
    .entry-desc {
      color: var(--text-secondary);
      font-size: 14.5px;
      line-height: 1.65;
      max-width: 620px;
      white-space: pre-wrap;
    }
    .entry-desc a { color: var(--accent-text); }
    .entry-hero {
      margin-top: 18px;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--bg-surface);
      max-width: 620px;
      aspect-ratio: 16 / 9;
    }
    .entry-hero img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tag {
      display: inline-flex; align-items: center;
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.04em;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .tag-new { background: var(--green-bg); color: var(--green-text); }
    .tag-improved { background: var(--blue-bg); color: var(--blue-text); }
    .tag-fixed { background: var(--amber-bg); color: var(--amber-text); }

    .compact-entries { display: flex; flex-direction: column; gap: 0; margin-top: 8px; }
    .compact-entry {
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: baseline;
      gap: 14px;
    }
    .compact-entry:last-child { border-bottom: none; }
    .compact-title {
      font-size: 14px; font-weight: 500;
      color: var(--text);
      flex: 1;
      min-width: 0;
    }
    .compact-date {
      font-size: 12px; color: var(--text-muted);
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* ===== Loading / empty / error states ===== */
    .feed-status {
      padding: 24px 0;
      color: var(--text-muted);
      font-size: 14px;
    }
    .feed-status.is-error { color: var(--rose-text); }
    .feed-skeleton {
      display: flex; flex-direction: column; gap: 36px;
      padding: 0 0 40px;
    }
    .feed-skeleton .sk-row {
      height: 18px;
      background: linear-gradient(90deg, var(--bg-surface), var(--bg-hover), var(--bg-surface));
      background-size: 200% 100%;
      border-radius: 6px;
      animation: shimmer 1.4s ease-in-out infinite;
    }
    .feed-skeleton .sk-row.sk-title { width: 70%; height: 22px; margin-bottom: 8px; }
    .feed-skeleton .sk-row.sk-meta { width: 30%; height: 14px; margin-bottom: 14px; }
    .feed-skeleton .sk-row.sk-desc { width: 90%; height: 14px; margin-bottom: 6px; }
    .feed-skeleton .sk-row.sk-desc-2 { width: 60%; height: 14px; }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ===== Footer ===== */
    .footer {
      border-top: 1px solid var(--border);
      padding: 36px 24px;
      margin-top: 40px;
    }
    .footer-inner {
      max-width: 1100px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 16px;
    }
    .footer-brand { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; letter-spacing: -0.01em; }
    .footer-tag { font-size: 13px; color: var(--text-muted); }
    .footer-links { display: flex; gap: 20px; flex-wrap: wrap; }
    .footer-links a {
      font-size: 13px; color: var(--text-muted); text-decoration: none;
      padding: 8px 4px; min-height: 44px; display: inline-flex; align-items: center;
      transition: color 0.2s;
    }
    .footer-links a:hover { color: var(--text); }
    .theme-toggle {
      background: none; border: none; border-radius: 8px;
      width: 44px; height: 44px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--text-muted); transition: color 0.2s, background 0.2s;
    }
    .theme-toggle:hover { color: var(--text-secondary); background: var(--bg-hover); }

    /* ===== Responsive ===== */
    @media (min-width: 640px) and (max-width: 1023px) {
      .changelog-layout { grid-template-columns: 120px 1fr; gap: 0 32px; }
      .entries { padding-left: 32px; }
    }
    @media (max-width: 639px) {
      .nav-inner { padding: 0 16px; height: 56px; }
      .nav-links { display: none; }
      .page-header { padding: 40px 16px 28px; }
      .page-title { font-size: 30px; }
      .subscribe-input { width: 100%; min-width: 0; flex: 1; }
      .changelog-layout {
        grid-template-columns: 1fr;
        padding: 0 16px 64px;
        gap: 0;
      }
      .date-index { display: none; }
      .entries {
        border-left: none;
        padding-left: 0;
      }
      .entry-hero { max-width: 100%; }
      .entry-desc { max-width: 100%; }
    }
    @media (min-width: 2560px) {
      .nav-inner, .page-header, .changelog-layout, .footer-inner { max-width: 1100px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .feed-skeleton .sk-row { animation: none; }
    }
  </style>
</head>
<body>

<nav class="nav" aria-label="Site">
  <div class="nav-inner">
    <a href="/" class="nav-logo">Maskin</a>
    <ul class="nav-links">
      <li><a href="/changelog" class="active" aria-current="page">Changelog</a></li>
      <li><a href="/docs/get-started/">Get started</a></li>
      <li><a href="https://github.com/sindre-ai/maskin" target="_blank" rel="noopener">GitHub</a></li>
    </ul>
    <a href="https://app.maskin.io" class="nav-cta" target="_blank" rel="noopener">Open app</a>
  </div>
</nav>

<header class="page-header">
  <h1 class="page-title">Changelog</h1>
  <p class="page-sub">Everything we ship, posted weekly.</p>
  <div class="header-actions">
    <form class="subscribe-form" id="subscribe-form" novalidate>

    <a href="https://maskin.sindre.ai/v1/changelog.xml" class="rss-link" title="Subscribe via RSS" rel="alternate" type="application/rss+xml">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M2 2C2 2 14 2 14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />

<main class="changelog-layout">
  <nav class="date-index" id="date-index" aria-label="Jump to month"></nav>

      <div>
        <div class="sk-row sk-title"></div>
        <div class="sk-row sk-meta"></div>

      </div>

</main>

<footer class="footer">
  <div class="footer-inner">
    <div>
      <div class="footer-brand">Maskin</div>
      <p class="footer-tag">sindre.ai</p>
    </div>
    <div class="footer-links">
      <a href="/">Home</a>
      <a href="/docs/get-started/">Get started</a>
      <a href="https://github.com/sindre-ai/maskin" target="_blank" rel="noopener">GitHub</a>
      <a href="https://maskin.sindre.ai/v1/changelog.xml" rel="alternate" type="application/rss+xml">RSS</a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme">
        <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" style="display:none"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <svg class="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </div>
</footer>

<script>
  // ---------- Theme (mirrors /index.html so dark/light persists across pages) ----------
  function getTheme() {
    try {
      const saved = localStorage.getItem('maskin-theme');
      if (saved) return saved;
    } catch (_) {}
    try {
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) return 'light';
    } catch (_) {}
    return 'dark';
  }
  function applyTheme(t) {
    if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    else document.documentElement.removeAttribute('data-theme');
    try { localStorage.setItem('maskin-theme', t); } catch (_) {}
    const sun = document.querySelector('.sun-icon');
    const moon = document.querySelector('.moon-icon');
    if (sun) sun.style.display = t === 'light' ? 'block' : 'none';
    if (moon) moon.style.display = t === 'light' ? 'none' : 'block';
  }
  applyTheme(getTheme());
  document.getElementById('theme-toggle').addEventListener('click', () => {
    applyTheme(getTheme() === 'dark' ? 'light' : 'dark');
  });

  // ---------- Config ----------
  function meta(name) {
    const el = document.querySelector('meta[name="' + name + '"]');
    return el ? el.getAttribute('content') : '';
  }
  const API_BASE = (meta('maskin-api-base') || 'https://maskin.sindre.ai').replace(/\/$/, '');
  const SUBSCRIBE_URL = meta('maskin-changelog-subscribe-url') || '';

  // ---------- Helpers ----------
  const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const MONTHS_LONG  = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function parseDate(raw) {
    if (!raw) return null;
    const d = new Date(raw);
    return isNaN(d.getTime()) ? null : d;
  }
  function fmtEntryDate(d) {
    return MONTHS_SHORT[d.getUTCMonth()] + ' ' + d.getUTCDate();
  }
  function monthSlug(d) {
    return MONTHS_SHORT[d.getUTCMonth()].toLowerCase() + '-' + d.getUTCFullYear();
  }
  function monthLabel(d) {
    return MONTHS_LONG[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }
  function safeImageUrl(u) {
    if (!u) return null;
    try {
      const parsed = new URL(u, 'https://sindre.ai/');
      if (parsed.protocol !== 'https:' && parsed.protocol !== 'http:') return null;
      return parsed.toString();
    } catch (_) { return null; }
  }
  function tagClass(t) {
    const lower = String(t || '').toLowerCase();
    if (lower === 'new') return 'tag-new';
    if (lower === 'improved') return 'tag-improved';
    if (lower === 'fixed') return 'tag-fixed';
    return 'tag-new';
  }
  function tagLabel(t) {
    const lower = String(t || '').toLowerCase();
    if (lower === 'new') return 'New';
    if (lower === 'improved') return 'Improved';
    if (lower === 'fixed') return 'Fixed';
    return 'New';
  }
  function isLeadTag(t) {
    return String(t || '').toLowerCase() === 'new';
  }

  // ---------- Render ----------
  function renderEmpty(container, dateIndex) {
    container.innerHTML = '<p class="feed-status">First entries shipping Friday, June 26.</p>';
    container.setAttribute('aria-busy', 'false');
    dateIndex.innerHTML = '';
  }

  function renderError(container, dateIndex) {
    container.innerHTML = '<p class="feed-status is-error">Couldn\u2019t load entries right now. Try a refresh, or follow the <a href="https://maskin.sindre.ai/v1/changelog.xml" rel="alternate" type="application/rss+xml">RSS feed</a> instead.</p>';
    container.setAttribute('aria-busy', 'false');
    dateIndex.innerHTML = '';
  }

  function buildGroups(entries) {
    const groups = new Map();
    for (const e of entries) {
      const d = parseDate(e.published_at) || parseDate(e.updated_at) || parseDate(e.created_at);
      if (!d) continue;
      const slug = monthSlug(d);
      if (!groups.has(slug)) {
        groups.set(slug, { slug, label: monthLabel(d), year: d.getUTCFullYear(), month: d.getUTCMonth(), date: d, entries: [] });
      }
      groups.get(slug).entries.push({ ...e, _date: d });
    }
    const list = Array.from(groups.values());
    list.sort((a, b) => b.date - a.date);
    for (const g of list) g.entries.sort((a, b) => b._date - a._date);
    return list;
  }

  function renderIndex(dateIndex, groups) {
    if (groups.length === 0) {
      dateIndex.innerHTML = '';
      return;
    }
    const byYear = new Map();
    for (const g of groups) {
      if (!byYear.has(g.year)) byYear.set(g.year, []);
      byYear.get(g.year).push(g);
    }
    let html = '';
    for (const [year, ms] of byYear) {
      html += '<div class="date-group-label">' + year + '</div>';
      for (const g of ms) {
        html += '<a href="#' + g.slug + '" class="date-index-item" data-month="' + g.slug + '">' + escapeHtml(MONTHS_LONG[g.month]) + '</a>';
      }
    }
    dateIndex.innerHTML = html;
  }

  function renderEntry(e) {
    const date = fmtEntryDate(e._date);
    const tag = tagClass(e.tag);
    const label = tagLabel(e.tag);
    const heroUrl = safeImageUrl(e.hero_image_url);
    const showHero = isLeadTag(e.tag) && heroUrl;
    return '' +
      '<article class="entry">' +
        '<div class="entry-meta">' +
          '<span class="entry-date">' + escapeHtml(date) + '</span>' +
          '<span class="tag ' + tag + '">' + escapeHtml(label) + '</span>' +
        '</div>' +
        '<h2 class="entry-title">' + escapeHtml(e.title || 'Untitled') + '</h2>' +
        (e.content ? '<p class="entry-desc">' + escapeHtml(e.content) + '</p>' : '') +
        (showHero
          ? '<div class="entry-hero"><img src="' + escapeHtml(heroUrl) + '" alt="" loading="lazy" /></div>'
          : '') +
      '</article>';
  }

  function renderCompact(e) {
    const date = fmtEntryDate(e._date);
    const tag = tagClass(e.tag);
    const label = tagLabel(e.tag);
    return '' +
      '<div class="compact-entry">' +
        '<span class="tag ' + tag + '">' + escapeHtml(label) + '</span>' +
        '<span class="compact-title">' + escapeHtml(e.title || 'Untitled') + '</span>' +
        '<span class="compact-date">' + escapeHtml(date) + '</span>' +
      '</div>';
  }

  // Per-month rhythm: first lead (New with hero, or first entry if none) expands; remaining stack as compact one-liners.
  function renderGroups(container, groups) {
    let html = '';
    for (const g of groups) {
      html += '<section class="month-group" id="' + g.slug + '">';
      html += '<div class="month-anchor" id="anchor-' + g.slug + '">' + escapeHtml(g.label) + '</div>';

      let leadIdx = g.entries.findIndex(e => isLeadTag(e.tag));
      if (leadIdx === -1) leadIdx = 0;
      const lead = g.entries[leadIdx];
      const rest = g.entries.filter((_, i) => i !== leadIdx);

      if (lead) html += renderEntry(lead);
      if (rest.length > 0) {
        html += '<div class="compact-entries">';
        for (const e of rest) html += renderCompact(e);
        html += '</div>';
      }
      html += '</section>';
    }
    container.innerHTML = html;
    container.setAttribute('aria-busy', 'false');
  }

  // ---------- Scroll-spy via IntersectionObserver ----------
  function activateScrollSpy() {
    const items = Array.from(document.querySelectorAll('.date-index-item'));
    if (items.length === 0) return;
    const sections = Array.from(document.querySelectorAll('.month-group'));
    if (sections.length === 0) return;

    function setActive(slug) {
      items.forEach(it => it.classList.toggle('active', it.getAttribute('data-month') === slug));
    }
    setActive(sections[0].id);

    if (!('IntersectionObserver' in window)) return;

    const visible = new Set();
    const obs = new IntersectionObserver((records) => {
      records.forEach(r => {
        if (r.isIntersecting) visible.add(r.target.id);
        else visible.delete(r.target.id);
      });
      const ordered = sections.map(s => s.id).filter(id => visible.has(id));
      if (ordered.length) setActive(ordered[0]);
    }, {
      rootMargin: '-80px 0px -55% 0px',
      threshold: 0
    });
    sections.forEach(s => obs.observe(s));
  }

  // ---------- Fetch + hydrate ----------
  async function loadChangelog() {
    const container = document.getElementById('entries');
    const dateIndex = document.getElementById('date-index');
    try {
      const res = await fetch(API_BASE + '/v1/changelog', { headers: { 'accept': 'application/json' } });
      if (!res.ok) throw new Error('http_' + res.status);
      const data = await res.json();
      const entries = Array.isArray(data && data.entries) ? data.entries : [];
      if (entries.length === 0) {
        renderEmpty(container, dateIndex);
        console.log('[changelog] hydrated 0 entries (empty state)');
        document.dispatchEvent(new CustomEvent('maskin:changelog-rendered', { detail: { entry_count: 0 } }));
        return;
      }
      const groups = buildGroups(entries);
      renderIndex(dateIndex, groups);
      renderGroups(container, groups);
      activateScrollSpy();
      console.log('[changelog] hydrated ' + entries.length + ' entries across ' + groups.length + ' month(s)');
      document.dispatchEvent(new CustomEvent('maskin:changelog-rendered', { detail: { entry_count: entries.length } }));
    } catch (err) {
      console.warn('[changelog] hydrate failed:', err && err.message ? err.message : err);
      renderError(container, dateIndex);
      document.dispatchEvent(new CustomEvent('maskin:changelog-rendered', { detail: { entry_count: 0 } }));
    }
  }
  loadChangelog();

  // ---------- Subscribe ----------
  (function () {
    const form = document.getElementById('subscribe-form');
    const btn = document.getElementById('subscribe-btn');
    const msg = document.getElementById('subscribe-msg');
    const input = document.getElementById('subscribe-email');

    function setMsg(text, kind) {
      msg.textContent = text || '';
      msg.classList.remove('is-error', 'is-success');
      if (kind === 'error') msg.classList.add('is-error');
      if (kind === 'success') msg.classList.add('is-success');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = (input.value || '').trim();
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        setMsg('Enter a valid email address.', 'error');
        input.focus();
        return;
      }
      btn.disabled = true;
      setMsg('');

      // mailto: opens the user's email client with a prefilled message. HTTP(S) URLs POST the email as a form.
      if (SUBSCRIBE_URL.startsWith('mailto:')) {
        try {
          const url = new URL(SUBSCRIBE_URL);
          url.searchParams.set('body', 'Please add ' + email + ' to the Maskin changelog list.');
          window.location.href = url.toString();
          setMsg('Subscribed. The next one lands Friday.', 'success');
          document.dispatchEvent(new CustomEvent('maskin:changelog-subscribed', { detail: { method: 'mailto' } }));
        } catch (_) {
          setMsg('That didn\u2019t go through. Try again, or use RSS.', 'error');
        } finally {
          btn.disabled = false;
        }
        return;
      }

      try {
        const body = new FormData();
        body.append('email', email);
        const res = await fetch(SUBSCRIBE_URL, { method: 'POST', body });
        if (!res.ok) throw new Error('http_' + res.status);
        setMsg('Subscribed. The next one lands Friday.', 'success');
        input.value = '';
        document.dispatchEvent(new CustomEvent('maskin:changelog-subscribed', { detail: { method: 'form' } }));
      } catch (err) {
        console.warn('[changelog] subscribe failed:', err && err.message ? err.message : err);
        setMsg('That didn\u2019t go through. Try again, or use RSS.', 'error');
      } finally {
        btn.disabled = false;
      }
    });
  })();
</script>
